{{- if and .Values.apiBack.autoscaling.enabled (not .Values.suspended) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: api-back
  namespace: {{ .Release.Namespace }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-back
  minReplicas: {{ .Values.apiBack.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiBack.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiBack.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}