services:
  api-back:
    build:
      context: .
      dockerfile: src/api_back/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: api-back
    env_file:
      - ./src/database/.env.postgres
      - ./src/api_back/.env
      - ./src/redis/.env.redis
    environment:
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:-}
      OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./src/common:/app/common:rw,z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - emsc-network

  api-collect:
    build:
      context: .
      dockerfile: src/api_collect/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: api-collect
    env_file:
      - ./src/redis/.env.redis
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - emsc-network

  api-front:
    build:
      context: ./src/api_front
    container_name: api-front
    env_file:
      - ./src/api_front/.env
      - ./src/database/.env.postgres
      - ./src/redis/.env.redis
    environment:
      AUTH_INTERNAL_KEY: ${AUTH_INTERNAL_KEY:-}
      API_BACK_URL: http://api-back:8000
    ports:
      - "8001:8001"
    depends_on:
      api-back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - emsc-network

  api-worker:
    build:
      context: .
      dockerfile: src/api_worker/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: api-worker
    env_file:
      - ./src/database/.env.postgres
      - ./src/redis/.env.redis
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - SAFEPASS=${SAFEPASS:-}
    volumes:
      - ./src/api_worker/worker.conf:/etc/worker/worker.conf:ro,z
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - emsc-network

  postgres:
    build:
      context: .
      dockerfile: src/database/Dockerfile
    container_name: db-main
    env_file:
      - ./src/database/.env.postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - emsc-network
      - emsc-migrations

  redis:
    build:
      context: .
      dockerfile: src/redis/dockerfile.redis
    container_name: redis-streams
    env_file:
      - ./src/redis/.env.redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user $${REDIS_USERNAME} --pass \"$${REDIS_PASSWORD}\" PING | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - default
      - emsc-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    driver: bridge
  emsc-migrations:
    driver: bridge
  emsc-network:
    driver: bridge
