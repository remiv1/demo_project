services:
  api-back:
    build:
      context: .
      dockerfile: src/api_back/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: api-back
    ports:
      - "8000:8000"
    volumes:
      - ./src/common:/app/common:rw,z
      - ./src/config:/app/config:rw,z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-front:
    build:
      context: ./src/api_front
    container_name: api-front
    env_file:
      - ./src/api_front/.env
    ports:
      - "8001:8001"
    depends_on:
      api-back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: src/database/Dockerfile
    container_name: db-main
    env_file:
      - ./src/database/.env.postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    build:
      context: .
      dockerfile: src/redis/dockerfile.redis
    container_name: redis-streams
    env_file:
      - ./src/redis/.env.redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user application --pass \"$${REDIS_APPLICATION_PASSWORD}\" PING | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
