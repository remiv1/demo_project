apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: demo-project

spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - name: db-main
        image: ghcr.io/remiv1/emsc-postgres:1.0.0
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -h
              - 127.0.0.1
              - -p
              - "5432"
          periodSeconds: 5
          timeoutSeconds: 2
        envFrom:
          - configMapRef:
              name: postgres-config
          - secretRef:
              name: env-postgres
        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
            ephemeral-storage: "2Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
