<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Événements{% endblock %} · Signal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Signal<span class="brand-mark">/</span></a>
    <nav aria-label="Navigation principale">
      <a href="{{ url_for('user.account') }}">Flux</a>
      <a href="{{ url_for('user.login_page') }}">Connexion</a>
    </nav>
  </header>
  <main class="page-content">{% block content %}{% endblock %}</main>
</body>
</html>
