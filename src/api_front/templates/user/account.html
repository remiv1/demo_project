{% extends "base.html" %}
{% block title %}
  Événements
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='js/events.js') }}" defer></script>
{% endblock %}
{% block content %}
<section class="events-layout">
  <div class="events-heading">
    <div>
      <span class="eyebrow">
        En direct
      </span>
      <h1>
        Événements
      </h1>
    </div>
    <span id="connection-status" class="connection-status" role="status">
      Connexion…
    </span>
  </div>
  <div class="events-toolbar">
    <span>
      Dernières notifications
    </span>
    <form method="post" action="{{ url_for('user.logout') }}" hx-post="{{ url_for('user.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="secondary">
        Se déconnecter
      </button>
    </form>
  </div>
  <div class="event-table-scroll" role="region" aria-label="Tableau des notifications" tabindex="0">
    <table class="event-table">
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Heure (UTC)</th>
          <th scope="col">Type</th>
          <th scope="col">Continent / Pays</th>
          <th scope="col">Magnitude / profondeur / coordonnées</th>
        </tr>
      </thead>
      <tbody id="events" aria-live="polite" aria-relevant="additions"></tbody>
    </table>
  </div>
</section>
{% endblock %}
