{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-aside"><span class="eyebrow">02 / Accès</span><h1>Bienvenue.</h1><p>Retrouvez votre espace personnel.</p></div>
  <div class="auth-panel">
    <h2>Connexion</h2>
    <form method="post" action="{{ url_for('user.login') }}" hx-post="{{ url_for('user.login') }}" hx-target="#feedback" hx-swap="innerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="feedback" aria-live="polite"></div>
      <button type="submit">Continuer</button>
    </form>
    <p class="auth-switch">Nouveau compte ? <a href="{{ url_for('user.register_page') }}">S'inscrire</a></p>
  </div>
</section>
{% endblock %}
